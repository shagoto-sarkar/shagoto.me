name: Deploy shagoto.me to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Diagnostics & Automated Assertion Suite
        run: npm test

      - name: Upload Build Artifacts
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages (Production)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Verifying build artifacts in dist/..."
          if [ ! -f "dist/index.html" ]; then
            echo "::error title=Missing Artifacts::dist/index.html not found!"
            exit 1
          fi
          echo "Artifacts verified (index.html present, $(find dist -type f | wc -l) files ready for deployment)."

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error title=Missing Cloudflare Secret::CLOUDFLARE_API_TOKEN is not set in GitHub repository secrets! Please add it in Repository Settings -> Secrets and variables -> Actions to enable manual production releases."
              exit 1
            else
              echo "::warning title=Deployment Skipped (Secret Missing)::CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets. Build and all 26 verification tests passed, but edge auto-deploy was skipped. Add CLOUDFLARE_API_TOKEN under Settings -> Secrets and variables -> Actions to enable automatic edge deployment on push."
              exit 0
            fi
          fi

          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-1e8d24858eeea95aeceb71b98246481d}"
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"

          echo "Deploying to Cloudflare Pages project 'shagoto-me'..."
          npx wrangler pages deploy dist --project-name=shagoto-me --branch=main
