<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="graphics-document document" aria-label="Architecture diagram of cashapp.shagoto.me showing multi-tenant dual-lens frontend, two-tier passwordless authentication, Cloudflare Pages functions, partitioned Cloudflare D1 SQLite database, and internal dev monitor.">
  <title>cashapp.shagoto.me Multi-Tenant Dual-Lens Edge Architecture</title>
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box { fill: #111827; stroke: #374151; stroke-width: 1.5; rx: 4px; }
      .box-emerald { fill: #111827; stroke: #10b981; stroke-width: 1.5; rx: 4px; }
      .box-amber { fill: #111827; stroke: #f59e0b; stroke-width: 1.5; rx: 4px; }
      .box-blue { fill: #111827; stroke: #3b82f6; stroke-width: 1.5; rx: 4px; }
      .text-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #f9fafb; text-anchor: middle; }
      .text-sub { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #9ca3af; text-anchor: middle; }
      .text-accent-emerald { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #10b981; text-anchor: middle; }
      .text-accent-amber { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #f59e0b; text-anchor: middle; }
      .text-accent-blue { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #60a5fa; text-anchor: middle; }
      .arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-emerald { stroke: #10b981; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-emerald); }
      .arrow-amber { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-amber); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280" />
    </marker>
    <marker id="arrowhead-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" class="bg" rx="6" />

  <!-- Node 1: Dual-Lens Client SPA -->
  <g transform="translate(25, 35)">
    <rect width="210" height="85" class="box-emerald" />
    <text x="105" y="24" class="text-title">Dual-Lens Client SPA</text>
    <text x="105" y="42" class="text-accent-emerald">📅 Monthly: Dynamic Smoothing</text>
    <text x="105" y="58" class="text-accent-amber">🔥 Hustle v2: Tactical Sprints</text>
    <text x="105" y="74" class="text-sub">Tactile Dialpad &amp; Pre-Spend</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 235 77 L 275 77" class="arrow-emerald" />

  <!-- Node 2: 2-Tier Passwordless Auth -->
  <g transform="translate(275, 35)">
    <rect width="200" height="85" class="box-blue" />
    <text x="100" y="24" class="text-title">Two-Tier Auth Gate</text>
    <text x="100" y="42" class="text-accent-blue">Tier 1: Resend Email OTP (6-digit)</text>
    <text x="100" y="58" class="text-sub">Tier 2: PBKDF2 PIN (100k iter)</text>
    <text x="100" y="74" class="text-sub">HMAC-SHA256 Session Cookie</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 475 77 L 515 77" class="arrow" />

  <!-- Node 3: Cloudflare Pages Edge Functions -->
  <g transform="translate(515, 35)">
    <rect width="215" height="85" class="box-amber" />
    <text x="107" y="24" class="text-title">Pages Edge Functions</text>
    <text x="107" y="42" class="text-accent-amber">One Ledger, Two Lenses API</text>
    <text x="107" y="58" class="text-sub">Fixed Bills Firewall &amp; Timezone</text>
    <text x="107" y="74" class="text-sub">Dhaka (UTC+6) Financial Bounds</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 730 77 L 770 77" class="arrow-amber" />

  <!-- Node 4: Multi-Tenant D1 Database -->
  <g transform="translate(770, 35)">
    <rect width="205" height="85" class="box" />
    <text x="102" y="24" class="text-title">Cloudflare D1 (SQLite)</text>
    <text x="102" y="42" class="text-sub">Partitioned by user_id</text>
    <text x="102" y="58" class="text-sub">users, expenses, debts,</text>
    <text x="102" y="74" class="text-sub">hustle_missions, parked_wishes</text>
  </g>

  <!-- Node 5 (Lower Left): StudioBridge Command Deck -->
  <g transform="translate(25, 155)">
    <rect width="210" height="90" class="box" />
    <text x="105" y="24" class="text-title">StudioBridge Deck (/studio)</text>
    <text x="105" y="42" class="text-sub">Bilateral Debt Repayments</text>
    <text x="105" y="58" class="text-sub">48h Impulse Cooling Vault</text>
    <text x="105" y="74" class="text-accent-emerald">AI Audit Markdown Exporter</text>
  </g>

  <!-- Path between Node 5 and Node 3 -->
  <path d="M 235 200 L 622 200 L 622 120" class="arrow" />

  <!-- Node 6 (Lower Right): Dev Telemetry Monitor -->
  <g transform="translate(515, 155)">
    <rect width="215" height="90" class="box-blue" />
    <text x="107" y="24" class="text-title">Dev Monitor (dev.*)</text>
    <text x="107" y="42" class="text-accent-blue">False-Transaction Threshold Guard</text>
    <text x="107" y="58" class="text-sub">Clean Spend vs. Raw Spend Delta</text>
    <text x="107" y="74" class="text-sub">Anomaly Watchdog Telemetry</text>
  </g>

  <!-- Path between Node 6 and Node 4 -->
  <path d="M 730 200 L 872 200 L 872 120" class="arrow" />

  <!-- Node 7 (Lower Right Edge): Zero-Stale Version Check -->
  <g transform="translate(770, 155)">
    <rect width="205" height="90" class="box" />
    <text x="102" y="24" class="text-title">Zero-Stale Heartbeat</text>
    <text x="102" y="42" class="text-sub">Background version.json Polling</text>
    <text x="102" y="58" class="text-sub">Auto-Reloads on Deployments</text>
    <text x="102" y="74" class="text-accent-amber">Prevents Stale PWA Caches</text>
  </g>
</svg>
